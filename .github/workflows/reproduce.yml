name: Reproduce household credit analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: household-credit-reproduce
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Pixi 0.84.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pixi-bin"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/pixi.tar.gz" \
            https://github.com/prefix-dev/pixi/releases/download/v0.84.2/pixi-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' \
            6d2a576bde0a7b26533a068fec0aea6e4ee21c36668efc1dc73fce90110906ae \
            "$RUNNER_TEMP/pixi.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/pixi.tar.gz" -C "$RUNNER_TEMP/pixi-bin"
          echo "$RUNNER_TEMP/pixi-bin" >> "$GITHUB_PATH"
      - name: Reproduce and validate
        run: pixi run --locked reproduce
      - name: Upload aggregate research results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: household-credit-aggregate-results
          path: reproduced/run-*/
          if-no-files-found: error
          retention-days: 30

  publish-results:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: reproduce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download validated aggregate results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: household-credit-aggregate-results
          path: artifacts
      - name: Commit validated aggregate research snapshot
        shell: bash
        run: |
          set -euo pipefail
          run_dir="$(find artifacts -maxdepth 1 -mindepth 1 -type d -name 'run-*' | sort | head -n 1)"
          test -n "$run_dir"
          test "$(find artifacts -maxdepth 1 -mindepth 1 -type d -name 'run-*' | wc -l)" -eq 1
          test -s "$run_dir/RESEARCH_NOTE.md"
          mkdir -p outputs/tables outputs/figures outputs/diagnostics
          cp "$run_dir"/tables/*.csv outputs/tables/
          cp "$run_dir"/figures/*.png outputs/figures/
          for file in sample_linkage.csv source_loan_record_counts.csv loan_field_diagnostics.csv \
            analysis_sample_checks.csv model_sample_sizes.csv \
            sector_source_coverage.csv annual_durable_purchase_source_counts.csv \
            source_text_classification_coverage.csv expenditure_quartile_boundaries.csv \
            input_hashes.txt loan_type_field_audit.csv \
            loan_entry_multiplicity.csv expenditure_leaveout_reconciliation.csv \
            alternative_expenditure_quartiles.csv alternative_rank_crosswalk.csv \
            measurement_sensitivity_summary.csv measurement_sensitivity_notes.txt; do
            cp "$run_dir/diagnostics/$file" "outputs/diagnostics/$file"
          done
          cp "$run_dir/RESULTS.md" outputs/RESULTS.md
          cp "$run_dir/RESEARCH_NOTE.md" outputs/RESEARCH_NOTE.md
          git add -A outputs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Update validated aggregate research results [skip ci]'
            git push origin HEAD:main
          fi
